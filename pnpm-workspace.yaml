packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  electron-winstaller: false
  protobufjs: true

# Flat node_modules: electron-builder and native-module rebuilds need a hoisted layout.
nodeLinker: hoisted

# electron-updater still resolves js-yaml ^4.1.0; require the merge-budget DoS fixes.
overrides:
  js-yaml: ^4.3.2
